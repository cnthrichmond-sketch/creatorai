<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta property="og:title" content="CreatorAI — IA gratis para Instagram y TikTok" />
  <meta property="og:description" content="Tu asistente de IA para crear contenido viral. Gratis." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://creatorai.app/" />
  <meta property="og:locale" content="es_ES" />
  <meta name="twitter:card" content="summary_large_image" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "CreatorAI",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
    "description": "Asistente de IA gratuito para creadores de contenido en Instagram y TikTok.",
    "url": "https://creatorai.app"
  }
  </script>
  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pink: #E8406A;
      --teal: #0DBFA0;
      --dark: #0E0E12;
      --dark2: #17171D;
      --dark3: #22222B;
      --border: rgba(255,255,255,0.08);
      --text: #F0EFF5;
      --muted: rgba(240,239,245,0.5);
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }
    html, body { height: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    body::before {
      content: '';
      position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
      width: 600px; height: 400px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(232,64,106,0.12), transparent 70%);
      pointer-events: none; z-index: 0;
    }

    nav {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(14,14,18,0.8);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }
    .nav-logo {
      font-family: var(--font-display); font-size: 18px; font-weight: 700;
      color: var(--text); text-decoration: none;
      display: flex; align-items: center; gap: 8px;
    }
    .logo-mark {
      width: 26px; height: 26px; border-radius: 7px;
      background: linear-gradient(135deg, var(--pink), var(--teal));
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
    }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-badge {
      font-size: 11px; padding: 3px 10px; border-radius: 20px;
      background: rgba(232,64,106,0.12); color: #FF8BA8;
      border: 1px solid rgba(232,64,106,0.25); font-weight: 500;
    }
    .nav-pro {
      font-size: 13px; font-weight: 500; padding: 7px 16px;
      border-radius: 8px; background: var(--pink); color: white;
      text-decoration: none; transition: opacity 0.2s;
    }
    .nav-pro:hover { opacity: 0.85; }

    main {
      flex: 1; display: flex; flex-direction: column;
      position: relative; z-index: 1; overflow: hidden;
      max-width: 780px; width: 100%; margin: 0 auto;
      padding: 0 16px;
    }

    .welcome {
      padding: 32px 0 20px;
      text-align: center; flex-shrink: 0;
    }
    .welcome-icon {
      width: 52px; height: 52px; border-radius: 14px;
      background: linear-gradient(135deg, var(--pink), var(--teal));
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; margin: 0 auto 16px;
    }
    .welcome h1 {
      font-family: var(--font-display); font-size: clamp(22px, 4vw, 32px);
      font-weight: 700; margin-bottom: 8px; line-height: 1.15;
    }
    .welcome p {
      font-size: 15px; color: var(--muted); line-height: 1.6;
      max-width: 480px; margin: 0 auto;
    }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 8px 0 16px;
      display: flex; flex-direction: column; gap: 16px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg { display: flex; gap: 10px; max-width: 100%; }
    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; margin-top: 2px;
    }
    .msg-avatar.ai { background: linear-gradient(135deg, var(--pink), var(--teal)); }
    .msg-avatar.user-av { background: var(--dark3); border: 1px solid var(--border); color: var(--muted); }

    .msg-bubble {
      max-width: 85%; padding: 12px 16px; border-radius: 16px;
      font-size: 14px; line-height: 1.65;
    }
    .msg.ai .msg-bubble {
      background: var(--dark2); border: 1px solid var(--border);
      border-top-left-radius: 4px; color: var(--text);
    }
    .msg.user .msg-bubble {
      background: var(--pink); color: white;
      border-top-right-radius: 4px;
    }

    .typing-dots span {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted); margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

    .quick-actions {
      flex-shrink: 0; display: flex; gap: 8px;
      flex-wrap: wrap; padding: 4px 0 12px;
    }
    .quick-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 20px; cursor: pointer;
      border: 1px solid var(--border); background: var(--dark2);
      color: var(--muted); font-size: 12px; font-weight: 500;
      font-family: var(--font-body); transition: all 0.15s; white-space: nowrap;
    }
    .quick-btn:hover { border-color: rgba(232,64,106,0.4); color: var(--text); background: var(--dark3); }

    .input-area {
      flex-shrink: 0; padding: 12px 0 20px;
      border-top: 1px solid var(--border);
    }
    .input-row {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--dark2); border: 1px solid var(--border);
      border-radius: 14px; padding: 10px 12px;
      transition: border-color 0.2s;
    }
    .input-row:focus-within { border-color: rgba(232,64,106,0.4); }
    textarea {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 14px; font-family: var(--font-body);
      resize: none; line-height: 1.5; max-height: 120px; scrollbar-width: none;
    }
    textarea::placeholder { color: var(--muted); }
    textarea::-webkit-scrollbar { display: none; }
    .send-btn {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      background: var(--pink); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s; color: white; font-size: 16px;
    }
    .send-btn:hover { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .input-hint {
      text-align: center; font-size: 11px; color: rgba(240,239,245,0.25);
      margin-top: 8px;
    }

    @media (max-width: 600px) {
      nav { padding: 12px 16px; }
      .welcome { padding: 20px 0 14px; }
      .welcome h1 { font-size: 22px; }
      .nav-badge { display: none; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">
    <div class="logo-mark">✦</div>
    CreatorAI
  </a>
  <div class="nav-right">
    <span class="nav-badge">Beta gratuita</span>
    <a href="mailto:hola@creatorai.app" class="nav-pro">Pro — 79€/mes</a>
  </div>
</nav>

<main>
  <div class="welcome" id="welcome-block">
    <div class="welcome-icon">✦</div>
    <h1>Tu IA para crecer en Instagram y TikTok</h1>
    <p>Genera ideas virales, guiones, captions y hashtags en segundos. Pregúntame lo que necesites o elige una herramienta rápida.</p>
  </div>

  <div class="chat-messages" id="chat"></div>

  <div class="quick-actions" id="quick-actions">
    <button class="quick-btn" onclick="quickSend('💡 Ideas virales', 'Genera 3 ideas virales para Reels de lifestyle con hook, estructura y por qué funcionan')">
      💡 Ideas virales
    </button>
    <button class="quick-btn" onclick="quickSend('✍️ Caption', 'Escríbeme 2 opciones de caption para Instagram que generen muchos comentarios, con emojis y llamada a la acción')">
      ✍️ Caption
    </button>
    <button class="quick-btn" onclick="quickSend('#️⃣ Hashtags', 'Dame una estrategia completa de hashtags para TikTok dividida en nichos pequeños, medianos y grandes')">
      #️⃣ Hashtags
    </button>
    <button class="quick-btn" onclick="quickSend('📈 Tendencias', 'Dime qué formatos y temas están arrasando ahora en TikTok e Instagram y cómo adaptarlos')">
      📈 Tendencias
    </button>
    <button class="quick-btn" onclick="quickSend('🎬 Guión Reel', 'Escríbeme un guión completo para un Reel de 30 segundos con hook potente, desarrollo y cierre con CTA')">
      🎬 Guión Reel
    </button>
    <button class="quick-btn" onclick="quickSend('🔍 Competencia', 'Cómo analizo a mi competencia en Instagram y TikTok para mejorar mi estrategia de contenido')">
      🔍 Competencia
    </button>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea
        id="user-input"
        placeholder="Pregúntame sobre tu contenido, nicho, captions, hashtags…"
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()" aria-label="Enviar">↑</button>
    </div>
    <div class="input-hint">CreatorAI puede cometer errores. Verifica la información importante.</div>
  </div>
</main>

<script>
const GEMINI_API_KEY = 'AIzaSyAK75huIOtUcICQpzixM_W4RSEwf-hP6zY';
const GEMINI_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + GEMINI_API_KEY;

const SYSTEM_PROMPT = `Eres CreatorAI, un asistente experto en creación de contenido para Instagram y TikTok.
Ayudas a creadores con: ideas virales, guiones, captions persuasivos, estrategias de hashtags, análisis de tendencias y crecimiento en redes sociales.
Responde siempre en español, de forma directa, práctica y accionable.
Usa emojis con moderación. Cuando generes listas usa saltos de línea claros.
Sé conciso pero completo. Evita respuestas genéricas, sé específico y útil.`;

let history = [];
let isLoading = false;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function quickSend(label, text) {
  hideWelcome();
  document.getElementById('user-input').value = text;
  sendMessage();
}

function hideWelcome() {
  const w = document.getElementById('welcome-block');
  if (w) w.style.display = 'none';
}

function addMessage(role, content, loading) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar ' + (role === 'ai' ? 'ai' : 'user-av');
  avatar.textContent = role === 'ai' ? '✦' : '👤';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  if (loading) {
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  } else {
    bubble.innerHTML = content.replace(/\n/g, '<br>');
  }

  div.appendChild(avatar);
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text || isLoading) return;

  hideWelcome();
  isLoading = true;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;

  addMessage('user', text);
  history.push({ role: 'user', parts: [{ text }] });

  const loadingBubble = addMessage('ai', '', true);

  try {
    const body = {
      system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
      contents: history
    };

    const res = await fetch(GEMINI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    const data = await res.json();
    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'Hubo un error. Inténtalo de nuevo.';

    loadingBubble.innerHTML = reply.replace(/\n/g, '<br>');
    history.push({ role: 'model', parts: [{ text: reply }] });

  } catch(e) {
    loadingBubble.innerHTML = 'Error de conexión. Por favor, inténtalo de nuevo.';
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
}
</script>

</body>
</html>
